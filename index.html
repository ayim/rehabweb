<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rehab Plan</title>

<!-- PWA / iOS home-screen -->
<meta name="theme-color" content="#F2EDE3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Plan" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23F2EDE3'/%3E%3Ccircle cx='90' cy='90' r='34' fill='none' stroke='%232C4A3E' stroke-width='6'/%3E%3Cpath d='M76 90 l10 10 l18 -22' stroke='%232C4A3E' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<!-- React + Babel from CDN. Babel transpiles the JSX below in the browser. -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #F2EDE3; }
  body { font-family: 'DM Sans', system-ui, sans-serif; color: #1A1A18; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  .serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; font-variation-settings: 'opsz' 36, 'SOFT' 50; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .fade { animation: fade 0.28s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid #2C4A3E; outline-offset: 3px; border-radius: 4px; }
  .row:active { background: rgba(0,0,0,0.025); }
  #root { padding-top: env(safe-area-inset-top); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const PLAN = [
  {
    key: 'hamstring',
    title: 'Hamstring',
    subtitle: 'Medial hamstring strain · 2× per day',
    items: [
      { id: 'h-iso', title: 'Hamstring bridge isometric', spec: '4 × 30s · 2× per day', cues: ['Knees bent to 60°', 'Hold steady, no movement'], video: null },
      { id: 'h-arom', title: 'Active knee extension', spec: '3 × 10 · 2× per day', cues: ['On your back, knees bent', 'Hold the right thigh', 'Slowly extend the knee'], video: null }
    ]
  },
  {
    key: 'workoutA',
    title: 'Non-running day Workout A',
    subtitle: 'Primary drills',
    items: [
      { id: 'a-goblet', title: 'Goblet squat', spec: '3 × 10 · 40 lb KB · 2s/2s · 1 min rest', cues: ['Hold the kettlebell at chest height', 'Pace: 2 seconds down, 2 seconds up', 'Drive through the full foot, brace the trunk'], video: null },
      { id: 'a-step', title: 'Step up and over', spec: '3 × 10 · any day', cues: ['Can be done on any day', 'Drive the knee over the foot', 'Control alignment of knee and ankle on the way up and down', 'Right foot points forward, not out'], video: { id: 'hP4jBnUeB18', short: false } },
      { id: 'a-bsq', title: 'Bulgarian split squat', spec: '3 × 8 · 2× 20 lb · 1 min rest', cues: ['Upright trunk', 'Drive the knee over the foot, pointing forward', 'Maximize knee translation over foot to promote ankle mobility'], video: { id: 'Gpkzq1HuhJ0', short: false } },
      { id: 'a-calf', title: 'Single-leg calf raise — peroneal focus', spec: '3 × 12 · 25 lb · 30 bpm · 2 RIR · slant board', cues: ['Stand on the slant board (slanty platform)', 'Peroneal focus — drive up through the big-toe side, foot slightly everted', 'Hold the weight on the side of the working leg', 'Match tempo to a 30 bpm metronome', 'Leave 2 reps in reserve'], video: { id: 'YCmLU4JoFac', short: false }, bpm: 30 }
    ]
  },
  {
    key: 'workoutB',
    title: 'Non-running day Workout B',
    subtitle: 'Primary drills',
    items: [
      { id: 'b-carry', title: 'Loaded carry march', spec: '4 × 45s on / 45s rest · 2× 63 lb', cues: ['Maintain upright posture and steady cadence', 'Trunk braced throughout'], video: { id: 'z4uPjkmWxSE', short: false } },
      { id: 'b-step', title: 'Step up and over', spec: '3 × 10 · any day', cues: ['Can be done on any day', 'Drive the knee over the foot', 'Control alignment of knee and ankle'], video: { id: 'hP4jBnUeB18', short: false } },
      { id: 'b-sldl', title: 'Single-leg deadlift, supported', spec: '3 × 8 · 1 DB · 1 min rest · pause', cues: ['Use a light support for balance only', 'Hinge from the hip, keep back flat', 'Slow eccentric — pause at the bottom'], video: { id: 'Ex_pPwkzS1k', short: true } },
      { id: 'b-calf', title: 'Single-leg calf raise — peroneal focus', spec: '3 × 12 · 25 lb · 30 bpm · 2 RIR · slant board', cues: ['Stand on the slant board (slanty platform)', 'Peroneal focus — drive up through the big-toe side, foot slightly everted', 'Hold the weight on the side of the working leg', 'Match tempo to a 30 bpm metronome', 'Leave 2 reps in reserve'], video: { id: 'YCmLU4JoFac', short: false }, bpm: 30 }
    ]
  },
  {
    key: 'rehab',
    title: 'Ankle',
    subtitle: 'Rehab drills · 3–4× per week',
    items: [
      { id: 'r-mobil', title: 'Ankle dorsiflexion mobilization', spec: '3 × 10 · resistance band', cues: ['Place the resistance band at the crease of the ankle', 'Drive the knee forward over the toes'], video: { id: '5jgUBrI-CpM', short: true } },
      { id: 'r-stretch', title: 'Gastrocnemius stretch', spec: '2 min · right leg only', cues: ['Lean against a wall, foot pointing straight forward', 'Push forefoot into the ground for 30 seconds', 'Then attempt to lift the foot for 30 seconds', 'Repeat for the full 2 minutes'], video: { id: '3_ZrG8PHKrk', short: false } },
      { id: 'r-dowel', title: 'Dorsiflexion + eversion with dowel', spec: 'Per coach guidance', cues: ['Drive the knee over the pinky toe', 'Optional: place a small Naboso wedge under the heel, wide side out'], video: { id: 'ZRepfDfgPCs', short: false } }
    ]
  }
];

const ALL_ITEMS = PLAN.flatMap(s => s.items);

// Target number of sets, parsed from the leading "N ×" of the spec (defaults to 1).
const targetSets = (item) => {
  const m = /^\s*(\d+)\s*×/.exec(item.spec || '');
  return m ? parseInt(m[1], 10) : 1;
};

const C = {
  bg: '#F2EDE3',
  card: '#FBF7EE',
  ink: '#1A1A18',
  inkSoft: '#54504A',
  inkMute: '#8E8A7E',
  accent: '#2C4A3E',
  border: 'rgba(26, 26, 24, 0.08)',
  borderStrong: 'rgba(26, 26, 24, 0.18)'
};

const STORAGE_KEY = 'rehab-state-v2';

function App() {
  const today = new Date().toISOString().slice(0, 10);
  // sets: { [id]: number of sets recorded today }
  const [sets, setSets] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const data = JSON.parse(raw);
      return data.date === today ? (data.sets || {}) : {};
    } catch { return {}; }
  });
  const [view, setView] = useState({ type: 'list', itemId: null });
  const [activeSection, setActiveSection] = useState('all');
  const [showVideos, setShowVideos] = useState(true);

  useEffect(() => {
    if (view.type === 'detail') window.scrollTo(0, 0);
  }, [view]);

  const persist = (next) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: today, sets: next }));
    } catch {}
  };

  // Each tap records one set. Tapping again once all sets are done resets to zero.
  const recordSet = (id) => {
    const item = ALL_ITEMS.find(i => i.id === id);
    const target = targetSets(item);
    const cur = sets[id] || 0;
    const next = { ...sets };
    if (cur >= target) delete next[id];
    else next[id] = cur + 1;
    setSets(next);
    persist(next);
  };

  const reset = () => {
    setSets({});
    persist({});
  };

  const isDone = (item) => (sets[item.id] || 0) >= targetSets(item);
  const totalDone = ALL_ITEMS.filter(isDone).length;
  const totalAll = ALL_ITEMS.length;
  const dateLabel = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  if (view.type === 'detail') {
    const item = ALL_ITEMS.find(i => i.id === view.itemId);
    if (!item) {
      setView({ type: 'list' });
      return null;
    }
    return <Detail item={item} sets={sets[item.id] || 0} target={targetSets(item)} onBack={() => setView({ type: 'list' })} onRecord={() => recordSet(item.id)} onReset={() => { const n = { ...sets }; delete n[item.id]; setSets(n); persist(n); }} />;
  }

  const displayedSections = activeSection === 'all' 
    ? PLAN 
    : PLAN.filter(s => s.key === activeSection);

  return (
    <div className="fade" style={{ minHeight: '100vh' }}>
      <nav style={{ 
        position: 'sticky', top: 0, zIndex: 100, 
        background: 'rgba(242, 237, 227, 0.9)', 
        backdropFilter: 'blur(8px)',
        borderBottom: `0.5px solid ${C.borderStrong}`,
        padding: '12px 24px',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        gap: 12, overflowX: 'auto', WebkitOverflowScrolling: 'touch'
      }}>
        <div style={{ display: 'flex', gap: 8 }}>
          {['all', ...PLAN.map(s => s.key)].map(key => (
            <button 
              key={key}
              onClick={() => setActiveSection(key)}
              style={{
                background: activeSection === key ? C.accent : 'transparent',
                color: activeSection === key ? C.bg : C.inkSoft,
                border: `1px solid ${activeSection === key ? C.accent : C.borderStrong}`,
                padding: '6px 12px', borderRadius: 20,
                fontSize: 11, fontWeight: 600, cursor: 'pointer',
                whiteSpace: 'nowrap', textTransform: 'uppercase', letterSpacing: '0.04em'
              }}
              className="mono"
            >
              {key === 'all' ? 'All' : PLAN.find(s => s.key === key).title}
            </button>
          ))}
        </div>
        <button 
          onClick={() => setShowVideos(!showVideos)}
          style={{
            background: showVideos ? C.accent : 'transparent',
            color: showVideos ? C.bg : C.inkMute,
            border: `1.5px solid ${showVideos ? C.accent : C.border}`,
            padding: '6px 14px', borderRadius: 20,
            fontSize: 10, fontWeight: 700, cursor: 'pointer',
            whiteSpace: 'nowrap', textTransform: 'uppercase', letterSpacing: '0.06em',
            display: 'flex', alignItems: 'center', gap: 6,
            transition: 'all 0.2s ease'
          }}
          className="mono"
        >
          <span style={{ width: 6, height: 6, borderRadius: '50%', background: showVideos ? '#fff' : C.border, display: 'inline-block' }} />
          {showVideos ? 'Videos ON' : 'Videos OFF'}
        </button>
      </nav>

      <header style={{ padding: '40px 24px 24px' }}>
        <div className="mono" style={{ fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase', color: C.inkMute, marginBottom: 14 }}>
          {dateLabel}
        </div>
        <h1 className="serif" style={{ fontSize: 44, lineHeight: 0.95, margin: 0, fontWeight: 400, letterSpacing: '-0.025em' }}>
          {activeSection === 'all' ? 'The plan' : PLAN.find(s => s.key === activeSection).title}
        </h1>
        <div style={{ marginTop: 22, display: 'flex', alignItems: 'center', gap: 12 }}>
          <Progress done={totalDone} total={totalAll} />
          <span className="mono" style={{ fontSize: 11, color: C.inkSoft, whiteSpace: 'nowrap', letterSpacing: '0.04em' }}>
            {totalDone}/{totalAll}
          </span>
          {totalDone > 0 && (
            <button onClick={reset} style={{ background: 'transparent', border: 'none', color: C.inkMute, fontSize: 11, cursor: 'pointer', padding: '4px 0', textDecoration: 'underline', textUnderlineOffset: 3 }}>
              reset
            </button>
          )}
        </div>
      </header>
      <main style={{ padding: '0 24px' }}>
        {displayedSections.map((section, idx) => (
          <Section
            key={section.key}
            section={section}
            sets={sets}
            showVideos={showVideos}
            onOpen={(id) => setView({ type: 'detail', itemId: id })}
            onRecord={recordSet}
            first={idx === 0}
          />
        ))}
      </main>
      <footer style={{ padding: '40px 24px 24px', textAlign: 'center' }}>
        <div className="mono" style={{ fontSize: 9, letterSpacing: '0.2em', textTransform: 'uppercase', color: C.inkMute }}>
          NYC marathon · ankle + hamstring rehab · base build
        </div>
      </footer>
    </div>
  );
}

function Progress({ done, total }) {
  const pct = total === 0 ? 0 : (done / total) * 100;
  return (
    <div style={{ flex: 1, height: 3, background: C.border, borderRadius: 2, overflow: 'hidden' }}>
      <div style={{ height: '100%', width: `${pct}%`, background: C.accent, transition: 'width 0.3s ease' }} />
    </div>
  );
}

function Section({ section, sets, showVideos, onOpen, onRecord, first }) {
  return (
    <section style={{ marginTop: first ? 12 : 40 }}>
      <div style={{ marginBottom: 8, paddingBottom: 14, borderBottom: `0.5px solid ${C.borderStrong}` }}>
        <div className="mono" style={{ fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase', color: C.accent, marginBottom: 6 }}>
          {section.title}
        </div>
        <div style={{ fontSize: 13, color: C.inkSoft, lineHeight: 1.5 }}>
          {section.subtitle}
        </div>
      </div>
      <div>
        {section.items.map(item => (
          <Row
            key={item.id}
            item={item}
            sets={sets[item.id] || 0}
            target={targetSets(item)}
            showVideos={showVideos}
            onOpen={() => onOpen(item.id)}
            onRecord={() => onRecord(item.id)}
          />
        ))}
      </div>
    </section>
  );
}

function Metronome({ bpm }) {
  const [playing, setPlaying] = useState(false);
  const [pulse, setPulse] = useState(false);
  const acRef = React.useRef(null);
  const timerRef = React.useRef(null);
  const nextNoteRef = React.useRef(0);

  const tick = (ac, time, accent) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.frequency.value = accent ? 1320 : 880;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(0.5, time + 0.001);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    osc.start(time);
    osc.stop(time + 0.06);
  };

  useEffect(() => {
    if (!playing) return;
    let ac = acRef.current;
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      acRef.current = ac;
    }
    if (ac.state === 'suspended') ac.resume();
    const interval = 60 / bpm;
    let count = 0;
    nextNoteRef.current = ac.currentTime + 0.12;
    const schedule = () => {
      while (nextNoteRef.current < ac.currentTime + 0.25) {
        const at = nextNoteRef.current;
        tick(ac, at, count % 4 === 0);
        const delay = Math.max(0, (at - ac.currentTime) * 1000);
        setTimeout(() => setPulse(p => !p), delay);
        nextNoteRef.current += interval;
        count++;
      }
    };
    schedule();
    timerRef.current = setInterval(schedule, 25);
    return () => clearInterval(timerRef.current);
  }, [playing, bpm]);

  useEffect(() => () => {
    if (timerRef.current) clearInterval(timerRef.current);
    if (acRef.current) acRef.current.close();
  }, []);

  return (
    <button
      onClick={(e) => { e.stopPropagation(); setPlaying(p => !p); }}
      className="mono"
      aria-label={playing ? 'Stop metronome' : 'Start metronome'}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 9,
        background: playing ? C.accent : 'transparent',
        color: playing ? C.bg : C.inkSoft,
        border: `1.5px solid ${playing ? C.accent : C.borderStrong}`,
        padding: '8px 14px', borderRadius: 999,
        fontSize: 11, fontWeight: 600, cursor: 'pointer',
        letterSpacing: '0.06em', textTransform: 'uppercase',
        transition: 'all 0.15s'
      }}
    >
      <span style={{
        width: 9, height: 9, borderRadius: '50%',
        background: playing ? '#fff' : C.inkMute,
        transform: playing && pulse ? 'scale(1.6)' : 'scale(1)',
        opacity: playing && pulse ? 1 : 0.6,
        transition: 'transform 0.08s ease, opacity 0.08s ease',
        display: 'inline-block'
      }} />
      {playing ? `${bpm} bpm · stop` : `Metronome ${bpm} bpm`}
    </button>
  );
}

// Tap to record a set. Shows a progress ring + count; a checkmark once all sets are done.
// Tapping when complete resets to zero.
function SetButton({ sets, target, onRecord, size = 32 }) {
  const done = sets >= target;
  const r = size / 2 - 0.75;
  const circ = 2 * Math.PI * r;
  const progress = target > 0 ? Math.min(sets / target, 1) : 0;
  return (
    <button
      onClick={(e) => { e.stopPropagation(); onRecord(); }}
      aria-label={done ? 'Reset sets' : `Record set ${sets + 1} of ${target}`}
      style={{
        position: 'relative', width: size, height: size, borderRadius: '50%',
        border: `1.5px solid ${done ? C.accent : C.borderStrong}`,
        background: done ? C.accent : 'transparent',
        flexShrink: 0, padding: 0, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        transition: 'all 0.15s'
      }}
    >
      {!done && sets > 0 && (
        <svg width={size} height={size} style={{ position: 'absolute', top: -1.5, left: -1.5, transform: 'rotate(-90deg)' }}>
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.accent} strokeWidth="1.5"
            strokeDasharray={circ} strokeDashoffset={circ * (1 - progress)} strokeLinecap="round"
            style={{ transition: 'stroke-dashoffset 0.25s ease' }} />
        </svg>
      )}
      {done ? (
        <svg width={Math.round(size * 0.5)} height={Math.round(size * 0.5)} viewBox="0 0 13 13">
          <path d="M3 6.5L5.4 8.9L10 4" stroke={C.bg} strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      ) : sets > 0 ? (
        <span className="mono" style={{ fontSize: Math.round(size * 0.37), fontWeight: 600, color: C.accent }}>{sets}</span>
      ) : null}
    </button>
  );
}

function Row({ item, sets, target, showVideos, onOpen, onRecord }) {
  const done = sets >= target;
  return (
    <div className="row" style={{
      padding: '32px 0',
      borderBottom: `0.5px solid ${C.borderStrong}`,
      opacity: done ? 0.4 : 1,
      transition: 'opacity 0.2s ease'
    }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 18, marginBottom: 16 }}>
        <div style={{ marginTop: 4 }}>
          <SetButton sets={sets} target={target} onRecord={onRecord} />
        </div>
        <div style={{ flex: 1 }}>
          <div className="serif" style={{
            fontSize: 26, fontWeight: 400, color: C.ink,
            textDecoration: done ? 'line-through' : 'none',
            letterSpacing: '-0.015em', lineHeight: 1.1,
            marginBottom: 6
          }}>
            {item.title}
          </div>
          <div className="mono" style={{
            fontSize: 13, color: C.inkSoft, letterSpacing: '0.04em',
          }}>
            {item.spec}
          </div>
          {target > 1 && (
            <div className="mono" style={{ fontSize: 11, color: done ? C.accent : C.inkMute, letterSpacing: '0.06em', marginTop: 8 }}>
              {sets}/{target} sets{done ? ' · done' : ' · tap to log a set'}
            </div>
          )}
        </div>
      </div>

      {item.cues && item.cues.length > 0 && (
        <div style={{ paddingLeft: 50 }}>
          <div className="mono" style={{ fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase', color: C.inkMute, marginBottom: 16, marginTop: 24 }}>
            Form cues
          </div>
          <ul style={{ margin: 0, padding: 0, listStyle: 'none' }}>
            {item.cues.map((cue, i) => (
              <li key={i} style={{ 
                display: 'flex', gap: 16, 
                fontSize: 15, lineHeight: 1.55, color: C.ink,
                marginBottom: 12
              }}>
                <span className="mono" style={{ fontSize: 11, color: C.inkMute, marginTop: 4, minWidth: 24 }}>
                  {String(i + 1).padStart(2, '0')}
                </span>
                <span style={{ flex: 1 }}>{cue}</span>
              </li>
            ))}
          </ul>
        </div>
      )}

      {item.bpm && (
        <div style={{ paddingLeft: 50, marginTop: 24 }}>
          <Metronome bpm={item.bpm} />
        </div>
      )}

      {showVideos && item.video && (
        <div style={{ paddingLeft: 50, marginTop: 24 }}>
          <div style={{
            position: 'relative', width: '100%',
            paddingBottom: '56.25%', /* 16:9 Aspect Ratio */
            height: 0,
            borderRadius: 12, overflow: 'hidden', background: '#000',
            boxShadow: '0 4px 20px rgba(0,0,0,0.08)'
          }}>
            <iframe
              key={`${item.id}-${showVideos}`}
              style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', border: 0 }}
              src={`https://www.youtube.com/embed/${item.video.id}?rel=0`}
              title={item.title}
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowFullScreen
            />
          </div>
        </div>
      )}
    </div>
  );
}

function Detail({ item, sets, target, onBack, onRecord, onReset }) {
  const done = sets >= target;
  return (
    <div className="fade" style={{ minHeight: '100vh' }}>
      <header style={{ padding: '24px 24px 4px' }}>
        <button onClick={onBack} style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: C.inkSoft, fontSize: 13, padding: '8px 0', display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <svg width="14" height="14" viewBox="0 0 14 14">
            <path d="M9 3l-4 4 4 4" stroke="currentColor" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
          The plan
        </button>
      </header>
      <main style={{ padding: '8px 24px 40px' }}>
        <h1 className="serif" style={{ fontSize: 38, lineHeight: 1.05, margin: '12px 0 14px', fontWeight: 400, letterSpacing: '-0.025em' }}>
          {item.title}
        </h1>
        <div className="mono" style={{ fontSize: 12, color: C.inkSoft, letterSpacing: '0.04em', marginBottom: 28 }}>
          {item.spec}
        </div>

        {item.bpm && (
          <div style={{ marginBottom: 32 }}>
            <Metronome bpm={item.bpm} />
          </div>
        )}

        {item.video && (
          <div style={{ 
            position: 'relative', width: '100%', 
            paddingBottom: '56.25%', /* 16:9 Aspect Ratio */
            height: 0,
            borderRadius: 14, overflow: 'hidden', background: '#000',
            marginBottom: 32, boxShadow: '0 8px 30px rgba(0,0,0,0.1)' 
          }}>
            <iframe
              style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', border: 0 }}
              src={`https://www.youtube.com/embed/${item.video.id}?rel=0`}
              title={item.title}
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowFullScreen
            />
          </div>
        )}

        {item.cues && item.cues.length > 0 ? (
          <div style={{ marginBottom: 36 }}>
            <div className="mono" style={{ fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase', color: C.accent, marginBottom: 14 }}>
              Form cues
            </div>
            <ol style={{ margin: 0, padding: 0, listStyle: 'none' }}>
              {item.cues.map((cue, i) => (
                <li key={i} style={{
                  display: 'flex', alignItems: 'flex-start', gap: 16,
                  padding: '14px 0',
                  borderTop: i === 0 ? 'none' : `0.5px solid ${C.border}`,
                  fontSize: 15, lineHeight: 1.55, color: C.ink
                }}>
                  <span className="mono" style={{ fontSize: 10, color: C.inkMute, marginTop: 5, minWidth: 18, letterSpacing: '0.05em' }}>
                    {String(i + 1).padStart(2, '0')}
                  </span>
                  <span style={{ flex: 1 }}>{cue}</span>
                </li>
              ))}
            </ol>
          </div>
        ) : (
          <div style={{ padding: '20px 22px', background: C.card, borderRadius: 12, color: C.inkMute, fontSize: 14, marginBottom: 32, lineHeight: 1.5, border: `0.5px solid ${C.border}` }}>
            No specific cues. Follow your standard form.
          </div>
        )}

        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <SetButton sets={sets} target={target} onRecord={onRecord} size={44} />
          <button
            onClick={onRecord}
            style={{
              flex: 1, padding: '17px',
              background: done ? 'transparent' : C.accent,
              color: done ? C.accent : C.bg,
              border: `1.5px solid ${C.accent}`,
              borderRadius: 999,
              fontSize: 14, fontWeight: 500,
              cursor: 'pointer', letterSpacing: '0.02em',
              transition: 'all 0.15s'
            }}
          >
            {done ? 'All sets done · tap to reset' : `Record set ${sets + 1} of ${target}`}
          </button>
        </div>
        {target > 1 && (
          <div className="mono" style={{ fontSize: 11, color: C.inkMute, letterSpacing: '0.06em', marginTop: 14, textAlign: 'center' }}>
            {sets}/{target} sets logged today
            {sets > 0 && !done && <button onClick={onReset} style={{ background: 'transparent', border: 'none', color: C.inkMute, fontSize: 11, cursor: 'pointer', marginLeft: 10, textDecoration: 'underline', textUnderlineOffset: 3 }}>reset</button>}
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
